spring.application.name=employee-status-batch

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/spring_batch?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=AL@0927
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=4

# Spring Batch 6 JDBC metadata tables
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# CSV and parallel processing
employee.batch.csv-file=src/main/resources/data/employee-status.csv
employee.batch.grid-size=4
employee.batch.cron=0 * * * * *
employee.batch.zone=Asia/Kolkata

#enable logging for the batch job
logging.level.com.example.employeebatch=INFO
